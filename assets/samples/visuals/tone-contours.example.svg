<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Tone contours</title>
  <desc id="desc">Pitch over time for the four Mandarin tones plus the neutral tone, labelled with tone numbers ma1 to ma5.</desc>
  <rect x="0" y="0" width="560" height="380" fill="#ffffff"/>

  <text x="16" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">Tone contours</text>
  <text x="16" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#57606a">Pitch over time; tone numbers follow ADR 0012 (ma1 to ma5).</text>

  <line x1="110" y1="84" x2="110" y2="352" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <line x1="500" y1="84" x2="500" y2="352" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <line x1="110" y1="352" x2="500" y2="352" stroke="#d0d7de"/>
  <text x="305" y="368" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#57606a">time</text>

  <text x="16" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#24292f">tone 1</text>
  <text x="16" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#57606a">level high</text>
  <path d="M110 88 L500 88" fill="none" stroke="#0969da" stroke-width="5" stroke-linecap="round"/>
  <circle cx="110" cy="88" r="4" fill="#0969da"/>
  <circle cx="500" cy="88" r="4" fill="#0969da"/>
  <text x="510" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0969da">ma1</text>

  <text x="16" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#24292f">tone 2</text>
  <text x="16" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#57606a">rising</text>
  <path d="M110 176 L500 142" fill="none" stroke="#1a7f37" stroke-width="5" stroke-linecap="round"/>
  <circle cx="110" cy="176" r="4" fill="#1a7f37"/>
  <circle cx="500" cy="142" r="4" fill="#1a7f37"/>
  <text x="510" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#1a7f37">ma2</text>

  <text x="16" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#24292f">tone 3</text>
  <text x="16" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#57606a">dip</text>
  <path d="M110 206 Q305 232 500 210" fill="none" stroke="#9a6700" stroke-width="5" stroke-linecap="round"/>
  <circle cx="110" cy="206" r="4" fill="#9a6700"/>
  <circle cx="500" cy="210" r="4" fill="#9a6700"/>
  <text x="510" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#9a6700">ma3</text>

  <text x="16" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#24292f">tone 4</text>
  <text x="16" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#57606a">falling</text>
  <path d="M110 250 L500 286" fill="none" stroke="#cf222e" stroke-width="5" stroke-linecap="round"/>
  <circle cx="110" cy="250" r="4" fill="#cf222e"/>
  <circle cx="500" cy="286" r="4" fill="#cf222e"/>
  <text x="510" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#cf222e">ma4</text>

  <text x="16" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#24292f">tone 5</text>
  <text x="16" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#57606a">neutral, short</text>
  <path d="M290 322 L410 322" fill="none" stroke="#8250df" stroke-width="5" stroke-linecap="round"/>
  <circle cx="290" cy="322" r="4" fill="#8250df"/>
  <circle cx="410" cy="322" r="4" fill="#8250df"/>
  <text x="510" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#8250df">ma5</text>
</svg>
