<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-labelledby="tone-contours-title tone-contours-desc">
  <title id="tone-contours-title">Chao tone contours for the Mandarin tones</title>
  <desc id="tone-contours-desc">A five-point pitch scale from 1 at the bottom to 5 at the top. Tone 1 is level at 5, tone 2 rises from 3 to 5, tone 3 dips from 2 to 1 and rises to 4, and tone 4 falls from 5 to 1. The neutral tone is a short line at mid pitch.</desc>

  <rect x="0" y="0" width="480" height="260" fill="#ffffff"/>

  <!-- Pitch gridlines, 5 (top) to 1 (bottom). -->
  <g stroke="#d0d0d0" stroke-width="1" fill="none">
    <line x1="60" y1="20" x2="440" y2="20"/>
    <line x1="60" y1="65" x2="440" y2="65"/>
    <line x1="60" y1="110" x2="440" y2="110"/>
    <line x1="60" y1="155" x2="440" y2="155"/>
    <line x1="60" y1="200" x2="440" y2="200"/>
  </g>

  <!-- Pitch scale labels. -->
  <g fill="#606060" font-family="sans-serif" font-size="12" text-anchor="end">
    <text x="52" y="24">5</text>
    <text x="52" y="69">4</text>
    <text x="52" y="114">3</text>
    <text x="52" y="159">2</text>
    <text x="52" y="204">1</text>
  </g>

  <!-- Axes. -->
  <g stroke="#404040" stroke-width="1.5" fill="none">
    <line x1="60" y1="20" x2="60" y2="200"/>
    <line x1="60" y1="200" x2="440" y2="200"/>
  </g>

  <g fill="#404040" font-family="sans-serif" font-size="12">
    <text x="34" y="14">pitch</text>
    <text x="430" y="220">time</text>
  </g>

  <!-- Tone 1: level, 55. -->
  <polyline points="60,20 440,20" fill="none" stroke="#1f77b4" stroke-width="3"/>
  <!-- Tone 2: rising, 35. -->
  <polyline points="60,110 440,20" fill="none" stroke="#2ca02c" stroke-width="3"/>
  <!-- Tone 3: dipping, 214. -->
  <polyline points="60,155 150,200 250,192 440,65" fill="none" stroke="#d62728" stroke-width="3"/>
  <!-- Tone 4: falling, 51. -->
  <polyline points="60,20 440,200" fill="none" stroke="#9467bd" stroke-width="3"/>
  <!-- Neutral tone: short, light, mid pitch. -->
  <line x1="60" y1="110" x2="150" y2="110" stroke="#7f7f7f" stroke-width="3" stroke-dasharray="6 4"/>

  <g font-family="sans-serif" font-size="13" font-weight="bold">
    <text x="446" y="24" fill="#1f77b4">1</text>
    <text x="380" y="30" fill="#2ca02c">2</text>
    <text x="300" y="196" fill="#d62728">3</text>
    <text x="380" y="200" fill="#9467bd">4</text>
    <text x="156" y="106" fill="#7f7f7f">5</text>
  </g>
</svg>
