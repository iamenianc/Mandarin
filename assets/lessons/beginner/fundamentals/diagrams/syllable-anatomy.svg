<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="syllable-title syllable-desc">
  <title id="syllable-title">Syllable anatomy</title>
  <desc id="syllable-desc">A Mandarin syllable shown as an initial, a final, and a tone number, using hao3 as the example.</desc>
  <rect x="0" y="0" width="640" height="220" fill="#ffffff"/>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="40" y="50" width="160" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="80" font-size="14" fill="#6b7280">initial</text>
    <text x="120" y="114" font-size="30" fill="#111827">h</text>
    <rect x="240" y="50" width="160" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="320" y="80" font-size="14" fill="#6b7280">final</text>
    <text x="320" y="114" font-size="30" fill="#111827">ao</text>
    <rect x="440" y="50" width="160" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="520" y="80" font-size="14" fill="#6b7280">tone</text>
    <text x="520" y="114" font-size="30" fill="#111827">3</text>
    <text x="220" y="104" font-size="28" fill="#6b7280">+</text>
    <text x="420" y="104" font-size="28" fill="#6b7280">+</text>
  </g>
  <text x="320" y="180" font-family="sans-serif" font-size="22" fill="#111827" text-anchor="middle">hao3</text>
  <text x="320" y="206" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">every syllable is an initial, a final, and a tone number</text>
</svg>
