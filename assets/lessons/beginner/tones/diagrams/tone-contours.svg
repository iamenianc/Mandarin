<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="tone-title tone-desc">
  <title id="tone-title">Tone contours</title>
  <desc id="tone-desc">Stylised pitch contours for the five Mandarin tones, labelled ma1 to ma5. Pitch falls from the top of the chart to the bottom.</desc>
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <g stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4">
    <line x1="40" y1="90" x2="620" y2="90"/>
    <line x1="40" y1="160" x2="620" y2="160"/>
    <line x1="40" y1="230" x2="620" y2="230"/>
    <line x1="40" y1="300" x2="620" y2="300"/>
  </g>
  <line x1="40" y1="60" x2="40" y2="300" stroke="#9ca3af" stroke-width="1"/>
  <g font-family="sans-serif" font-size="14" fill="#6b7280">
    <text x="34" y="86" text-anchor="end">high</text>
    <text x="34" y="304" text-anchor="end">low</text>
  </g>
  <g fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="80,90 170,90"/>
    <polyline points="190,280 280,90"/>
    <polyline points="300,150 345,290 390,110"/>
    <polyline points="400,90 490,290"/>
    <polyline points="510,170 600,190"/>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#111827" text-anchor="middle">
    <text x="125" y="330">ma1</text>
    <text x="235" y="330">ma2</text>
    <text x="345" y="330">ma3</text>
    <text x="455" y="330">ma4</text>
    <text x="565" y="330">ma5</text>
  </g>
  <text x="320" y="354" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">tone 5 has no fixed contour; its pitch follows the preceding tone</text>
</svg>
